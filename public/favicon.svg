<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded-square background -->
  <rect width="32" height="32" rx="7" fill="#0071e3"/>

  <!-- Envelope body -->
  <rect x="5" y="9" width="22" height="15" rx="2.5" fill="none" stroke="white" stroke-width="1.6"/>

  <!-- Envelope flap / V fold -->
  <polyline points="5,10.5 16,18.5 27,10.5" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Unsubscribe X — small red badge bottom-right -->
  <circle cx="23.5" cy="22.5" r="5" fill="#ff3b30"/>
  <line x1="21.3" y1="20.3" x2="25.7" y2="24.7" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25.7" y1="20.3" x2="21.3" y2="24.7" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
</svg>
